version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-dev-key
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:postgres@db:5432/freelanceflow
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=freelanceflow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  celery:
    build: .
    command: celery -A core worker --loglevel=info
    environment:
      - SECRET_KEY=django-insecure-dev-key
      - DATABASE_URL=postgres://postgres:postgres@db:5432/freelanceflow
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A core beat --loglevel=info
    environment:
      - SECRET_KEY=django-insecure-dev-key
      - DATABASE_URL=postgres://postgres:postgres@db:5432/freelanceflow
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data: