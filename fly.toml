# fly.toml app configuration file generated for freelanceflow-api on 2026-06-03T16:50:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'freelanceflow-api'
primary_region = 'cdg'
console_command = '/code/manage.py shell'

[build]

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'

[processes]
  app = 'daphne -b 0.0.0.0 -p 8000 core.asgi'
  celery = 'celery -A core worker --loglevel=INFO'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
